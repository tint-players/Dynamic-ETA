name: Simulator dashboard CI

on:
  push:
    branches:
      - frontend-simulator-dashboard
      - multi-train-track-stations-v1
      - multi-train-track-v2
      - multi-train-track-v3
      - multi-train-track-v4
  pull_request:
    branches:
      - component-a-simulator-v1
      - frontend-simulator-dashboard
      - multi-train-track-stations-v1
      - multi-train-track-v2
      - multi-train-track-v3
      - multi-train-track-v4

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt

      - name: Run simulator smoke test
        run: python smoke_test.py

      - name: Run backend tests
        run: |
          set -o pipefail
          pytest backend/tests -q 2>&1 | tee backend-test.log

      - name: Upload backend test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-log
          path: backend-test.log
          if-no-files-found: ignore

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install

      - name: Type-check frontend
        working-directory: frontend
        run: npm run typecheck

      - name: Build frontend
        working-directory: frontend
        run: npm run build
