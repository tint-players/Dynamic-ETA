dynamic_signalling: true

crossovers:
  - crossover_id: "XOVER-AGRA-01"
    block_id: "BLK-07"
    start_position_m: 1800
    end_position_m: 2200
    from_track_id: "TRACK-UP"
    to_track_id: "TRACK-DOWN"

train:
  train_id: "TRAIN-12002"
  train_name: "Bhopal Shatabdi"
  track_id: "TRACK-UP"
  max_speed_kmh: 130
  length_m: 300
  accel_ms2: 0.5
  service_decel_ms2: 0.7
  emergency_decel_ms2: 1.0
  initial_state: {start_block_id: "BLK-01", position_in_block_m: 0, initial_speed_kmh: 0}

journey:
  source: {block_id: "BLK-01", position_in_block_m: 0}
  destination: {block_id: "BLK-08", position_in_block_m: 2000}

primary_station_stops:
  - {station_id: "MATHURA", dwell_time_s: 35}
  - {station_id: "FARAH", dwell_time_s: 25}
  - {station_id: "AGRA-CANTT", dwell_time_s: 40}

additional_train_runs:
  - train:
      train_id: "TRAIN-CROSS-UP"
      train_name: "Intercity Crossover Express"
      track_id: "TRACK-UP"
      max_speed_kmh: 110
      length_m: 280
      accel_ms2: 0.42
      service_decel_ms2: 0.65
      emergency_decel_ms2: 1.0
      initial_state: {start_block_id: "BLK-03", position_in_block_m: 200, initial_speed_kmh: 0}
    journey:
      source: {block_id: "BLK-03", position_in_block_m: 200}
      destination: {block_id: "BLK-08", position_in_block_m: 1800}
    departure_time_s: 0
    station_stops:
      - {station_id: "FARAH", dwell_time_s: 45}
      - {station_id: "AGRA-CANTT", dwell_time_s: 35}
    track_changes:
      - {crossover_id: "XOVER-AGRA-01"}
  - train:
      train_id: "TRAIN-FOLLOW-UP"
      train_name: "Taj Local"
      track_id: "TRACK-UP"
      max_speed_kmh: 95
      length_m: 240
      accel_ms2: 0.38
      service_decel_ms2: 0.62
      emergency_decel_ms2: 0.95
