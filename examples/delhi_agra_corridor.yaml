    journey:
      source: {block_id: "BLK-01", position_in_block_m: 0}
      destination: {block_id: "BLK-07", position_in_block_m: 2100}
    departure_time_s: 150
    station_stops:
      - {station_id: "BALLABGARH", dwell_time_s: 30}
      - {station_id: "MATHURA", dwell_time_s: 50}
      - {station_id: "FARAH", dwell_time_s: 30}
  - train:
      train_id: "TRAIN-DOWN-01"
      train_name: "Agra Delhi Express"
      track_id: "TRACK-DOWN"
      max_speed_kmh: 120
      length_m: 300
      accel_ms2: 0.46
      service_decel_ms2: 0.68
      emergency_decel_ms2: 1.0
      initial_state: {start_block_id: "BLK-08", position_in_block_m: 1900, initial_speed_kmh: 0}
    journey:
      source: {block_id: "BLK-08", position_in_block_m: 1900}
      destination: {block_id: "BLK-01", position_in_block_m: 100}
    departure_time_s: 55
    station_stops:
      - {station_id: "AGRA-CANTT", dwell_time_s: 35}
      - {station_id: "FARAH", dwell_time_s: 25}
      - {station_id: "MATHURA", dwell_time_s: 40}
      - {station_id: "BALLABGARH", dwell_time_s: 25}

